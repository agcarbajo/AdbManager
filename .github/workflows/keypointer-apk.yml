name: Build KeyPointer APK
on:
  push:
    branches: [build-keypointer-apk]
    paths:
      - 'keypointer-build/**'
      - '.github/workflows/keypointer-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract KeyPointer project
        run: |
          mkdir -p keypointer
          base64 -d keypointer-build/source.tar.xz.b64 | tar -xJf - -C keypointer
          ls -la keypointer
      - name: Install SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install 'platforms;android-37' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build APK
        working-directory: keypointer
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KeyPointer-debug-apk
          path: keypointer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
